version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fraudshield_postgres
    environment:
      POSTGRES_DB: fraudshield_db
      POSTGRES_USER: fraudshield_user
      POSTGRES_PASSWORD: fraudshield_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudshield_user -d fraudshield_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: fraudshield_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 config.wsgi:application"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-fraudshield-dev-secret-key
      - USE_POSTGRES=True
      - DB_NAME=fraudshield_db
      - DB_USER=fraudshield_user
      - DB_PASSWORD=fraudshield_password
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
